name: tfsec
permissions: write-all
on:
  pull_request:
    paths:
      - '**/*.tf'
      - '*.tf'
jobs:
  tfsec:
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
    uses: clouddrove/github-shared-workflows/.github/workflows/security-tfsec.yml@v2
    secrets: inherit
    with:
      working_directory: '.'
